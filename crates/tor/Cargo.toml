[package]
name = "zerosum-tor"
version.workspace = true
edition = "2024"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Embedded Tor via Arti
arti-client = { version = "0.29", features = ["onion-service-service", "onion-service-client"] }
tor-rtcompat = { version = "0.29", features = ["tokio"] }
tor-hsservice = "0.29"
tor-cell = "0.29"
tor-proto = "0.29"
tor-config = "0.29"

# SOCKS for client connections through embedded Tor
tokio-socks = "0.5"
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
