name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Upload Release Assets
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and Upload zerosum-client
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: zerosum-client
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Upload zerosum-server
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: zerosum-server
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
