[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/crypto",
    "crates/tor",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "ZeroSum — friend-to-friend encrypted messaging over Tor"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rand = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
